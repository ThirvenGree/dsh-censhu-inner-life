<!doctype html><meta charset="utf-8"><title>独处实时动态</title><style>
/* 岑舒插件界面：档案卡样式。生活、独处、主动进行三页共用这一套变量与组件，仅强调色不同。 */
:root{color-scheme:light dark;
--paper:#eef1ee;--card:#fbfcfa;--field:#f5f7f5;--ink:#1e2a27;--ink-2:#3b4945;--muted:#66746f;--rule:#d9e0dc;--rule-2:#c4cec9;
--warn:#7a5810;--warn-soft:#f5edd6;--danger:#983a38;--danger-soft:#f5e3e0;--on-accent:#fff;
--life:#2e6a5c;--inner:#3d5a8c;--agency:#9b3a51;
--display:"FangSong","STFangsong","FangSong_GB2312","仿宋","Noto Serif SC","Noto Serif CJK SC","Songti SC",serif;
--sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--paper:#121715;--card:#1a201e;--field:#151b19;--ink:#dce5e1;--ink-2:#bccac4;--muted:#8a9893;--rule:#2b3532;--rule-2:#3b4743;
--warn:#e2c27c;--warn-soft:#2e291b;--danger:#eda69c;--danger-soft:#36221f;--on-accent:#0f1513;--life:#7cb8a6;--inner:#9aaedb;--agency:#e48fa3}}
:root{--accent-soft:color-mix(in srgb,var(--accent) 11%,var(--card));--accent-line:color-mix(in srgb,var(--accent) 38%,var(--card))}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.7 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4,p{margin:0}
h1{font:400 clamp(26px,3.4vw,35px)/1.3 var(--display);letter-spacing:.04em}
h2{font-size:17px;font-weight:600;line-height:1.45}
h3{font-size:14.5px;font-weight:600;line-height:1.5}
small{font-size:12px}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
::selection{background:color-mix(in srgb,var(--accent) 24%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--rule-2);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 14px;line-height:1.5;transition:border-color .15s,background-color .15s}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary,.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.primary:hover:not(:disabled){border-color:var(--accent);filter:brightness(1.07)}
.subtle{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.small{font-size:12px;padding:5px 11px}
input,select,textarea{background:var(--field);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;outline:none;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px;margin:0;padding:0;flex:none}
textarea{width:100%;resize:vertical;line-height:1.75}
pre,.context{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--field);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;margin:10px 0 0;font:12.5px/1.75 var(--sans);max-height:360px;overflow:auto;color:var(--ink-2)}
details{margin:4px 0}
summary{cursor:pointer;list-style:none;color:var(--muted);font-size:13px;padding:6px 0;display:flex;align-items:center;gap:9px;width:fit-content;max-width:100%}
summary::-webkit-details-marker{display:none}
summary::before{content:'';flex:none;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details[open]>summary::before{transform:rotate(45deg)}
summary:hover{color:var(--ink)}

/* 页首档案卡：分类标签 + 打孔 + 身后叠放的卡片 */
.app{max-width:1200px;margin:0 auto;padding:12px 32px 96px}
.hero{position:relative;margin:46px 12px 30px 0;padding:26px 30px 24px 62px;background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--accent);border-radius:0 6px 6px 6px;
 box-shadow:6px 6px 0 -1px var(--card),6px 6px 0 0 var(--rule-2),12px 12px 0 -1px var(--card),12px 12px 0 0 var(--rule)}
.hero::before{content:'';position:absolute;left:24px;top:50%;width:13px;height:13px;margin-top:-6px;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 2px rgba(0,0,0,.22)}
.hero-tab{position:absolute;left:-1px;bottom:100%;display:flex;align-items:baseline;gap:10px;max-width:calc(100% + 1px);padding:6px 16px 5px;background:var(--accent);color:var(--on-accent);border-radius:6px 6px 0 0;font-size:13px;font-weight:600;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-tab small{font-size:11px;font-weight:400;letter-spacing:.04em;opacity:.78}
.hero-body{display:flex;justify-content:space-between;align-items:flex-start;gap:14px 24px;flex-wrap:wrap}
.hero-body>div:first-child{flex:1 1 380px;min-width:0}
.hero p{margin-top:10px;color:var(--ink-2);font-size:15px;max-width:60ch}
.hero .eyebrow{margin-top:14px;font-size:11px;letter-spacing:.06em;color:var(--muted)}
.hero .meta{margin-top:12px;font-size:12px;color:var(--muted)}
.hero-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.pill,.badge{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border:1px solid var(--rule-2);border-radius:999px;font-size:12px;line-height:1.5;color:var(--ink-2);background:var(--card);max-width:100%;overflow-wrap:anywhere}
.online::before{content:'';flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:22px 24px;margin-bottom:16px;min-width:0}
.card>h2,.card>h3{margin-bottom:6px}
.card>h3:not(:first-child),.card>h2:not(:first-child){margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px;margin-bottom:16px}
.metric{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;min-width:0}
.metric-label{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.metric-value{font-size:26px;font-weight:600;line-height:1.3;margin:8px 0 4px;color:var(--ink);overflow-wrap:anywhere}
.metric-value.is-text{font-size:19px}
.metric small{display:block;font-size:12px;color:var(--muted)}
.card[role=alert]{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 28%,var(--warn-soft))}
.card[role=alert]>h3{color:var(--warn)}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:11px 16px;margin-bottom:16px;font-size:13px}
.warn[hidden]{display:none}
.entry{padding:16px 0;border-top:1px solid var(--rule)}
.entry:first-child{border-top:0;padding-top:4px}
.entry h3{font-size:15px;margin:6px 0 4px}
.entry p{white-space:pre-wrap;margin:5px 0;color:var(--ink-2)}
.entry small,.entry time{display:block;color:var(--muted);font-size:12px;margin:3px 0}
.tag{display:inline-block;font-size:11px;line-height:1.6;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:1px}
.tag:empty{display:none}
#terra-review-health{max-width:1200px;margin:0 auto;padding:14px 32px 0;font-size:12px;color:var(--muted)}
@media(max-width:700px){.app{padding:8px 16px 88px}#terra-review-health{padding:12px 16px 0}.hero{padding:22px 18px 20px 42px;margin-top:42px}.hero::before{left:15px;width:11px;height:11px}.card{padding:18px}.metric{padding:15px 16px}.metric-value{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:root{--accent:var(--inner)}
.hero.compact{margin-top:42px;padding-top:20px;padding-bottom:18px}
.hero.compact h1{font-size:clamp(22px,3vw,28px)}
.hero.compact p{font-size:13px;color:var(--muted)}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px;align-items:start}
#cards>section{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;min-width:0}
#cards h3{margin:0 0 8px;font-size:15px}
#cards p{white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0;color:var(--ink-2)}
#cards article{border-top:1px solid var(--rule);padding:10px 0}
#cards article p:first-child{font-size:12px;color:var(--muted)}
#cards details p{font-size:13px;color:var(--muted)}
.bad{color:var(--warn)}
</style><div class="app"><header class="hero compact"><div class="hero-tab">岑舒独处<small>实时动态</small></div><div class="hero-body"><div><h1>她的独处 · 实时动态</h1><p id="notice">只读展示 · 不会触发聊天或调用模型</p></div><small id="stamp" class="pill">读取中</small></div></header><main id="cards"></main></div><script>
const el=(tag,text)=>{const n=document.createElement(tag);n.textContent=text??'';return n;};const time=t=>t?new Date(t).toLocaleString('zh-CN'):'尚未安排';
const labels={waiting:'等待下一次变化',ready:'已就绪',reading:'读取中',reflecting:'独处思考中',auditing:'审核中',judging:'感知判断中',private:'留给自己',later:'稍后考虑',offer:'愿意分享',pending:'待处理',delivered:'已递交分享机会',expired:'已过期',uncertain:'不确定',attend:'现在关注',record:'只记下',tentative:'正在形成',established:'已形成',observing:'继续观察',disabled:'已关闭'};const label=x=>labels[x]||x||'暂无';
function syncText(x){return x?'角色扮演 '+(x.cosplay?'已同步':'未确认')+' · 生活插件 '+(x.life?'已同步':'未确认')+' · '+(x.count||0)+' 项':'尚无同步结果';}function section(title){const n=el('section');n.append(el('h3',title));document.querySelector('#cards').append(n);return n;}function lines(n,items){for(const text of items.filter(Boolean))n.append(el('p',text));}function details(n,title,items){const d=el('details');d.append(el('summary',title));lines(d,items);n.append(d);}
async function refresh(){try{const r=await fetch('/dsh-censhu-inner-life/state');if(!r.ok)throw Error('HTTP '+r.status);const v=await r.json();document.querySelector('#cards').replaceChildren();document.querySelector('#stamp').textContent='更新于 '+new Date().toLocaleTimeString();document.querySelector('#notice').textContent=[v.error,v.warning].filter(Boolean).join(' · ')||'只读展示 · 自动刷新 · 不会触发聊天或调用模型';
let n=section('感知与运行');lines(n,[label(v.status),`待感知 ${v.pending} · 已记下 ${v.recorded}`,v.lastDecision?label(v.lastDecision.decision)+'：'+v.lastDecision.reason:'尚无感知判断','下次考虑：'+time(v.nextAt),v.retryAt?'重试：'+time(v.retryAt):'',`今日注意判断 ${v.daily.judgments} / ${v.config.maxJudgmentsDaily} · 独处 ${v.daily.reflections} / ${v.config.maxReflectionsDaily}`]);details(n,'逐项判断',(v.attentionItems||[]).map(x=>x.name+' · '+label(x.decision)+'：'+x.reason+' · 复看 '+time(x.revisitAt)));
n=section('她的日记、感受与打算');for(const x of v.entries){const a=el('article');lines(a,[time(x.at),x.feeling,x.reflection,x.intention?'打算：'+x.intention:'',x.behaviorHint?'临时表达：'+x.behaviorHint:'','有效至 '+time(x.expiresAt)+(x.supersededAt?' · 已被新认识替代':'')]);details(a,'分享与实际联动',[label(x.shareState),x.shareBlocked,x.shareReview?.reason,x.effects?.error,x.effects?.result?'记忆：'+(x.effects.result.memory||'无新增')+' · 心情：'+(x.effects.result.mood||'无新增'):'',x.moodAudit?.distinctReason]);n.append(a);}if(!v.entries.length)lines(n,['尚无独处日记']);
n=section('独属于她的生活积累');const g=v.personalGrowth;lines(n,[label(g.status),g.error,'下次复看 '+time(g.nextReviewAt)]);for(const x of g.items||[])lines(n,[(x.kind||'积累')+' · '+x.text,x.projectState?'进展：'+label(x.projectState):'',x.reason]);if(!g.items?.length)lines(n,['尚未形成长期积累']);details(n,'审核、更新和同步',[(g.skipped||[]).map(x=>x.reason).join('；'),'同步：'+syncText(g.sync),...(g.history||[]).slice(-5).map(x=>time(x.at)+' · '+(x.reason||JSON.stringify(x.changes||[])))]);
n=section('当前性格与演变');const p=v.personality;lines(n,[label(p.status),p.error,'下次考虑 '+time(p.nextAt)]);for(const x of p.activeItems||[])lines(n,[x.text,label(x.status)+' · 更新 '+time(x.updatedAt),x.reason,'有效至 '+time(x.expiresAt)]);if(!p.activeItems?.length)lines(n,['暂无当前生效的新倾向，保留原有人设']);details(n,'观察中 / 不确定 / 历史',(p.items||[]).filter(x=>!p.activeItems?.some(a=>a.id===x.id)).map(x=>label(x.status)+' · '+x.text));details(n,'变化与依据',[(p.history||[]).slice(-5).map(x=>time(x.at)+' · '+x.reason).join('\n'),...(p.sources||[]).map(x=>x.name+' · '+x.status+(x.error?' · '+x.error:''))]);
n=section('动态筛选与分享');lines(n,[label(v.deliberation?.status),v.deliberation?.error]);details(n,'最近分享投递',(v.deliveries||[]).slice(-10).map(x=>time(x.at)+' · '+label(x.state)));details(n,'筛选状态详情',Object.values(v.deliberation?.shares||{}).concat(Object.values(v.deliberation?.contexts||{})).slice(-12).map(x=>time(x.at)+' · '+label(x.decision)+'：'+(x.reason||'')+' · 有效至 '+time(x.expiresAt)));
n=section('正在生效的联动');lines(n,[v.health?.message,v.isolation?.message,v.initiativeHealth?.message,'生活积累同步：'+syncText(g.sync),'性格同步：'+syncText(p.sync),'会话同步：'+v.display?.message]);details(n,'审核未采用的记录',(v.rejected||[]).map(x=>time(x.at)+' · '+x.reason));
}catch(e){document.querySelector('#notice').textContent='暂时无法更新：'+e.message;}}
refresh();setInterval(refresh,5000);
</script>
