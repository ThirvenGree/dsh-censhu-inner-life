name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dsh-censhu-inner-life
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-censhu-inner-life
      - uses: actions/checkout@v4
        with:
          repository: ThirvenGree/dsh-cen-shu-life
          ref: aee5e6ae11c82b9e7ae4ad2a5b7c93ec4ab44bb8
          path: dsh-cen-shu-life
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ../dsh-cen-shu-life --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
