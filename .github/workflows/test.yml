name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dsh-censhu-inner-life
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-censhu-inner-life
      - uses: actions/checkout@v4
        with:
          repository: ThirvenGree/dsh-cen-shu-life
          ref: 9b88a3e1951a3d2cd9becb88d53c283dcc3dd254
          path: dsh-cen-shu-life
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
