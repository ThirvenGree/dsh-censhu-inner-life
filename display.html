<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独处生活 · 实时展示</title>
<style>body{margin:0;padding:24px;font:14px/1.8 'Segoe UI','Microsoft Yahei',sans-serif;color:#293f38;background:#f4f7f5}h1{font-size:26px;margin:0}small{color:#72877e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card,article{padding:18px;background:white;border:1px solid #e0e8e2;border-radius:16px;margin-bottom:14px}strong{display:block;font-size:18px}p{white-space:pre-wrap;overflow-wrap:anywhere}button{background:white;color:#426652;border:1px solid #ccdcd2;border-radius:9px;padding:8px 16px;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center}time{color:#72877e}.tag{color:#426652}#error{color:#a14d30}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style>
<header><div><small>INNER LIFE · 动态生活记录</small><h1>岑舒独处的时光</h1></div><button id="refresh">刷新</button></header>
<p>这里展示已经审核的感受、思考和打算。查看页面不会唤醒模型、发送消息或写入记忆。</p><small id="updated">正在读取…</small><p id="error" role="status"></p>
<div class="grid"><div class="card">运行状态<strong id="status">—</strong></div><div class="card">待感知变化<strong id="pending">—</strong></div><div class="card">下一次考虑<strong id="next">—</strong></div></div>
<section class="card"><h2>最近的判断</h2><p id="decision">—</p></section><h2>感受 · 思考 · 后续打算</h2><div id="entries"></div><section class="card"><h2>与其他部分的实际联动</h2><div id="effects"></div></section>
<script>
const $=id=>document.getElementById(id),time=n=>n?new Date(n).toLocaleString('zh-CN'):'待安排';const text=v=>typeof v==='string'?v:JSON.stringify(v??'');let busy=false;
function row(parent,label,value){if(value===undefined||value===null||value==='')return;const p=document.createElement('p');p.textContent=label+'：'+text(value);parent.append(p);}
async function refresh(){if(busy)return;busy=true;try{const r=await fetch('/dsh-censhu-inner-life/state',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();if(!s.ok)throw Error(s.error||'无法读取');$('status').textContent=s.busy?'正在感知':s.health?.ready?'运行中':s.status||'待检查';$('pending').textContent=s.pending;$('next').textContent=s.nextAt&&s.nextAt<Date.now()?'等待调度（窗口已到）':time(s.nextAt);$('decision').textContent=s.lastDecision?.reason||'尚无判断';$('error').textContent=s.error||s.warning||'';$('updated').textContent='更新于 '+time(Date.now())+' · 每 15 秒自动刷新';$('entries').replaceChildren();for(const e of s.entries||[]){const a=document.createElement('article');const t=document.createElement('time');t.textContent=time(e.at||e.createdAt);a.append(t);row(a,'感受',e.feeling);row(a,'思考',e.reflection);row(a,'打算',e.intention||e.intentions);row(a,'分享状态',({private:'留给自己',delivered:'已递交分享通知',superseded:'已被后续记录替代',pending:'等待判断',queued:'已排队'})[e.shareState||e.shareDecision]||e.shareState||e.shareDecision);row(a,'联动处理',e.effects?.applied?'处理完成（不代表每项都发生变化）':e.effects?.error||'等待处理');$('entries').append(a);}if(!s.entries?.length)$('entries').textContent='还没有通过审核的独处记录，新的记录会自动出现在这里。';$('effects').replaceChildren();row($('effects'),'工具隔离',s.toolIsolation?.ready?'已生效':'待检查');row($('effects'),'最近回执',Object.keys(s.receipts||{}).length?s.receipts:'暂无独立回执');for(const d of (s.deliveries||[]).slice(-3))row($('effects'),'分享机会',time(d.at)+' · '+(d.state==='queued'?'已递交通知；不等于已向QQ发送':d.state));}catch(e){$('error').textContent='读取失败：'+e.message;}finally{busy=false;}}
$('refresh').onclick=refresh;refresh();setInterval(()=>{if(!document.hidden)refresh();},15000);
</script></html>
